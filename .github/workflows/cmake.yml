name: CMake

on: [push, workflow_dispatch]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  unix:
    name: CMake (${{ matrix.os }}, ncurses)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Install wide ncurses (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libncurses-dev libncursesw5-dev

    - name: Install wide ncurses (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ncurses
        echo "CMAKE_PREFIX_PATH=$(brew --prefix ncurses)" >> "$GITHUB_ENV"

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Smoke test (--help exits before curses starts)
      run: ./build/R136 -h

  windows:
    name: CMake (windows-latest, PDCurses)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install PDCurses (vcpkg)
      run: vcpkg install pdcurses:x64-windows

    - name: Configure
      run: >
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    # No smoke-run step here: this job's value is verifying the CMake +
    # PDCurses build (configure/compile/link), which had no CI coverage before.
    # The Unix jobs run the "-h" smoke test; on the hosted Windows image the
    # freshly built binary fails to start for environment reasons unrelated to
    # the source, so a runtime run here would be flaky.
